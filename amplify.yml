version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22
    build:
      commands:
        - npx wirejs-deploy-amplify-basic@llm prebuild
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npx wirejs-deploy-amplify-basic@llm inject-backend
        - npm run build
        - npx wirejs-deploy-amplify-basic@llm build-hosting-artifacts
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
